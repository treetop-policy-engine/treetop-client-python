# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - integration: false
          - integration: true

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check out exact REST candidate
        if: matrix.integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: treetop-policy-engine/treetop-rest
          ref: fce2e1fa8f44244c201dd87731ba63e5f203a8e0
          path: .candidate-rest
          persist-credentials: false
      - name: Build candidate server
        if: matrix.integration
        run: docker build -t treetop-rest-candidate:0.1.0 .candidate-rest

      - name: Run type checks
        if: matrix.integration == false
        run: |
          uv run pyright
          uv run basedpyright
          
      - name: Run pytest
        run: |
          if [ "${{ matrix.integration }}" = "true" ]; then
            export TREETOP_REST_VERSION=v0.1.0
            export TREETOP_REST_IMAGE=treetop-rest-candidate:0.1.0
            docker compose -f docker-compose.integration.yml pull integration-test-cedar-server
            uv run pytest -m integration
          else
            uv run pytest
          fi
