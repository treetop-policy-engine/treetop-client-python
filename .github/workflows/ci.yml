# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - integration: false
          - integration: true

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run type checks
        if: matrix.integration == false
        run: |
          uv run pyright
          uv run basedpyright
          
      - name: Run pytest
        run: |
          if [ "${{ matrix.integration }}" = "true" ]; then
            export TREETOP_REST_VERSION=v0.2.0
            export TREETOP_REST_IMAGE=ghcr.io/treetop-policy-engine/treetop-rest@sha256:e29baeb5b498f21c72dccd9d08ab43198fa4705cecb40643d0ee97b63cc1c932
            docker compose -f docker-compose.integration.yml pull
            uv run pytest -m integration
          else
            uv run pytest
          fi
