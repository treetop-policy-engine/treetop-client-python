# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - integration: false
          - integration: true

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest-known"
          
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run type checks
        if: matrix.integration == false
        run: |
          uv run pyright
          uv run basedpyright
          
      - name: Run pytest
        run: |
          if [ "${{ matrix.integration }}" = "true" ]; then
            export TREETOP_REST_VERSION=v0.3.0
            export TREETOP_REST_IMAGE=ghcr.io/treetop-policy-engine/treetop-rest@sha256:69d8cde73510f0219a0359f5baa5cf049f98b8eab87148540e72ac385725c772
            docker compose -f docker-compose.integration.yml pull
            uv run pytest -m integration
          else
            uv run pytest
          fi
