# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        integration: [false, true]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run type checks
        if: matrix.integration == false
        run: |
          uv run pyright
          uv run basedpyright
          
      - name: Run pytest
        run: |
          if [ "${{ matrix.integration }}" = "true" ]; then
            export TREETOP_REST_IMAGE=ghcr.io/treetop-policy-engine/treetop-rest:v0.0.12
            docker compose -f docker-compose.integration.yml pull
            uv run pytest -m integration
          else
            uv run pytest
          fi
